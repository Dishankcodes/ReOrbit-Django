<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The tab title and description change per page (src/shared/pageMeta.js);
         these defaults are what link previews (WhatsApp, LinkedIn, X) and search engines see first. -->
    <title>ReOrbit — Give your things a second orbit</title>
    <meta
      name="description"
      content="ReOrbit is a circular marketplace in Gujarat: sell what you no longer use, buy pre-loved finds, donate for free pickup and discover ReMakers who turn rescued pieces into new work."
    />
    <meta name="theme-color" content="#2A4D3A" />
    <meta name="application-name" content="ReOrbit" />
    <link rel="canonical" href="https://dishankcodes-reorbit.vercel.app/" />

    <!-- ReOrbit's globe-and-orbit mark in the browser tab, bookmarks and home screen -->
    <link rel="icon" type="image/png" sizes="64x64" href="/images/brand/reorbit-globe-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/brand/reorbit-globe-192.png" />
    <link rel="apple-touch-icon" href="/images/brand/reorbit-globe-192.png" />

    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReOrbit" />
    <meta property="og:title" content="ReOrbit — Give your things a second orbit" />
    <meta
      property="og:description"
      content="Sell what you no longer use, buy pre-loved finds, donate for free pickup and discover ReMakers in Gujarat."
    />
    <meta property="og:url" content="https://dishankcodes-reorbit.vercel.app/" />
    <meta property="og:image" content="https://dishankcodes-reorbit.vercel.app/images/brand/reorbit-globe-512.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ReOrbit — Give your things a second orbit" />
    <meta
      name="twitter:description"
      content="Sell what you no longer use, buy pre-loved finds, donate for free pickup and discover ReMakers in Gujarat."
    />
    <meta name="twitter:image" content="https://dishankcodes-reorbit.vercel.app/images/brand/reorbit-globe-512.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
